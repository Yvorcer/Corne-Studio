[package]
name = "corne-studio"
version = "0.1.0"
description = "Desktop keymap editor for the Corne split keyboard family (v1–v4), live over USB via VIA"
repository = "https://github.com/Yvorcer/corne-studio"
authors = ["yvorcer"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "corne_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Already part of Tauri's dependency tree; used for the overlay window and App Nap.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSProcessInfo", "NSString"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
